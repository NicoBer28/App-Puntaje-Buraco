# Compila, corre los tests unitarios y el análisis estático en cada push y pull request.
name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json no está en el repo. Los tests no usan Firebase, así que alcanza con
      # una configuración falsa con el mismo paquete (ver .github/ci/).
      - name: Configuración de Firebase para compilar
        run: cp .github/ci/google-services.json app/google-services.json

      - name: Tests unitarios
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # Los tests de UI necesitan un emulador; acá solo se verifica que compilen.
      - name: Compilar tests de UI
        run: ./gradlew assembleDebugAndroidTest

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
